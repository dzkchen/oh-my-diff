[test-groups."@tool:omd:embedded-app-server"]
max-threads = 4

[[profile.default.overrides]]
# Each case starts embedded app servers; a full codex-tui run otherwise starts so many at once that they time out.
filter = 'package(codex-tui) & (test(/^app::tests::session_lifecycle_requests::/) | test(/^app::tests::background_task_defaults_tests::/) | test(/^app::tests::fresh_sparkle_tests::/) | test(/^app::agents_overview::tests::actions::/))'
test-group = '@tool:omd:embedded-app-server'
slow-timeout = { period = "1m", terminate-after = 3 }
