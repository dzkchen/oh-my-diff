name: Documentation
description: Something in the docs is wrong, missing or unclear
labels: ["type: docs", "status: triage"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: docs/install.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
