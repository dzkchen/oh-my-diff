name: Nightly

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.repository == 'dzkchen/oh-my-diff'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          install_args: python@3.14.6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: package
          path: release
      - name: Publish passing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          OMD_RELEASE_SIGNING_KEY: ${{ secrets.OMD_RELEASE_SIGNING_KEY }}
        run: python3 .github/scripts/ci.py publish --directory release
