name: Pull request

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.select.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false
      - id: select
        env:
          PR_BASE_SHA: ${{ github.event.merge_group.base_sha || 'HEAD^1' }}
        run: python3 scripts/pr_ci.py select

  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          install_args: node python@3.14.6 actionlint@1.7.12
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: mods/package.json
      - run: pnpm --dir mods install --frozen-lockfile
      - run: mise run mods:check
      - run: mise run native:ownership
      - name: Generated locks match sources
        run: |
          python3 -m scripts.mods_lock
          python3 -m scripts.plugin_lock
      - name: Host-free Python tests
        run: python3 -m unittest tests.test_pr_ci tests.test_native_ownership tests.test_mod_conformance tests.test_build_provenance
      - name: Workflow lint
        run: mise exec actionlint@1.7.12 -- actionlint

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          install_args: node python@3.14.6
      - name: Install pinned Rust toolchain
        run: |
          OMD_RUST_TOOLCHAIN=$(python3 -c 'import json; print(json.load(open("upstream.lock.json"))["rust_toolchain"])')
          rustup toolchain install "$OMD_RUST_TOOLCHAIN" --profile minimal --component rust-src
          rustup default "$OMD_RUST_TOOLCHAIN"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock.json') }}-${{ hashFiles('runtime/patches/manifest.json') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock.json') }}-
      - name: Replay patch and check drift
        run: |
          python3 .github/scripts/build.py setup pr
          python3 .github/scripts/build.py sync pr
          git add --intent-to-add -- runtime upstream.lock.json
          git diff --exit-code -- runtime upstream.lock.json
      - name: Compile native code and tests
        run: |
          python3 .github/scripts/build.py v8 pr
          python3 .github/scripts/build.py cargo pr /private/tmp/omd-bpr/logs/check.log check --locked -p codex-cli -p codex-exec -p codex-omd -p codex-omd-runner -p codex-omd-extension -p codex-tui -p codex-core -p codex-core-plugins -p codex-git-utils --tests
      - name: Preserve native logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr-native-logs
          path: /private/tmp/omd-bpr/logs/
          retention-days: 7

  gate:
    name: PR gate
    needs: [changes, portable, native]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - env:
          PR_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/pr_ci.py gate
