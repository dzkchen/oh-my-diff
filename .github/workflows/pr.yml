name: Pull request

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.select.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false
      - id: select
        env:
          PR_BASE_SHA: ${{ github.event.merge_group.base_sha || 'HEAD^1' }}
        run: python3 scripts/pr_ci.py select

  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          install_args: node python@3.14.6 actionlint@1.7.12 git-cliff
          cache_save: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: mods/package.json
      - run: pnpm --dir mods install --frozen-lockfile
      - run: mise run mods:check
      - run: mise run native:ownership
      - name: Generated locks match sources
        run: |
          python3 -m scripts.mods_lock
          python3 -m scripts.plugin_lock
      - name: Release metadata
        run: python3 scripts/release.py check
      - name: Host-free Python tests
        run: |
          sudo install -d -m 1777 /private/tmp
          python3 -m unittest tests.test_pr_ci tests.test_native_ownership tests.test_mod_conformance tests.test_build_provenance \
            tests.test_release tests.test_install_updates tests.test_package
      - name: Workflow lint
        run: mise exec actionlint@1.7.12 -- actionlint

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_TEST_DEBUG: '0'
      OMD_WORK_ROOT: /Users/runner/omd
      OMD_SCCACHE: '1'
      SCCACHE_DIR: /Users/runner/omd/sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          install_args: node python@3.14.6 aqua:mozilla/sccache
          cache_save: false
      - name: Install pinned Rust toolchain
        run: |
          OMD_RUST_TOOLCHAIN=$(python3 -c 'import json; print(json.load(open("upstream.lock.json"))["rust_toolchain"])')
          rustup toolchain install "$OMD_RUST_TOOLCHAIN" --profile minimal --component rustfmt,rust-src
          rustup default "$OMD_RUST_TOOLCHAIN"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock.json') }}-${{ hashFiles('runtime/patches/manifest.json') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock.json') }}-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.OMD_WORK_ROOT }}/omd-cache/v8
          key: v8-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock.json') }}-${{ hashFiles('runtime/patches/manifest.json') }}
          restore-keys: v8-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock.json') }}-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-lint-${{ runner.os }}-${{ hashFiles('upstream.lock.json', 'runtime/patches/manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            sccache-lint-${{ runner.os }}-${{ hashFiles('upstream.lock.json', 'runtime/patches/manifest.json') }}-
            sccache-lint-${{ runner.os }}-
      - name: Replay patch and check drift
        run: |
          python3 .github/scripts/build.py setup nightly
          python3 .github/scripts/build.py sync nightly
          git add --intent-to-add -- runtime upstream.lock.json
          git diff --exit-code -- runtime upstream.lock.json
      - name: Rustfmt
        run: python3 .github/scripts/build.py cargo nightly "$OMD_WORK_ROOT/omd-bnightly/logs/fmt.log" fmt -p codex-omd -p codex-omd-runner -p codex-omd-extension -p codex-tui -p codex-core-plugins -p codex-git-utils -p codex-core -- --check
      - name: Compile native code and tests
        run: |
          python3 .github/scripts/build.py v8 nightly
          python3 .github/scripts/build.py check nightly
      - name: sccache statistics
        if: always()
        continue-on-error: true
        run: sccache --show-stats && sccache --stop-server
      - name: Preserve native logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr-native-logs
          path: ${{ env.OMD_WORK_ROOT }}/omd-bnightly/logs/
          retention-days: 7

  gate:
    name: PR gate
    needs: [changes, portable, native]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - env:
          PR_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/pr_ci.py gate
