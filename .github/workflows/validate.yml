name: Validate

on:
  workflow_call:
    inputs:
      version:
        description: Stable release version to package; empty packages a nightly
        type: string
        default: ''

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_TEST_DEBUG: '0'
  OMD_RELEASE_VERSION: ${{ inputs.version }}
  # Outside /tmp, which a sandboxed command may write: upstream tests expect a write beside the checkout to be denied.
  OMD_WORK_ROOT: /Users/runner/omd
  OMD_NIGHTLY_ROOT: /Users/runner/omd/omd-nightly

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 360
    steps: &rust-job
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          install_args: node python@3.14.6
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: mods/package.json
      - name: Install pinned Rust toolchain
        run: |
          OMD_RUST_TOOLCHAIN=$(python3 -c 'import json; print(json.load(open("upstream.lock.json"))["rust_toolchain"])')
          rustup toolchain install "$OMD_RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt,rust-src
          rustup default "$OMD_RUST_TOOLCHAIN"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock.json') }}-${{ hashFiles('runtime/patches/manifest.json') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock.json') }}-
      - name: Validate
        run: python3 .github/scripts/ci.py validate --job "$GITHUB_JOB" ${OMD_RELEASE_VERSION:+--release}
      - name: Pack host binaries
        if: github.job == 'build'
        run: tar -cf "$OMD_NIGHTLY_ROOT/host-binaries.tar" -C "$OMD_WORK_ROOT/omd-bnightly" artifacts
      - name: Upload host binaries
        if: github.job == 'build'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: host-binaries
          path: ${{ env.OMD_NIGHTLY_ROOT }}/host-binaries.tar
          retention-days: 1
          compression-level: 0
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: validation-report-${{ github.job }}
          path: |
            ${{ env.OMD_NIGHTLY_ROOT }}/report.md
            ${{ env.OMD_NIGHTLY_ROOT }}/logs/
            ${{ env.OMD_WORK_ROOT }}/omd-bnightly/logs/
          retention-days: 14

  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps: *rust-job

  package:
    needs: build
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          install_args: node python@3.14.6
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: mods/package.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: host-binaries
          path: ${{ env.OMD_NIGHTLY_ROOT }}
      - name: Unpack host binaries
        run: mkdir -p "$OMD_WORK_ROOT/omd-bnightly" && tar -xf "$OMD_NIGHTLY_ROOT/host-binaries.tar" -C "$OMD_WORK_ROOT/omd-bnightly"
      - name: Validate
        run: python3 .github/scripts/ci.py validate --job package
      - name: Build and test the package
        run: python3 .github/scripts/ci.py package ${OMD_RELEASE_VERSION:+--version "$OMD_RELEASE_VERSION"}
      - name: Upload validated package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: package
          path: ${{ env.OMD_NIGHTLY_ROOT }}/release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: validation-report-package
          path: |
            ${{ env.OMD_NIGHTLY_ROOT }}/report.md
            ${{ env.OMD_NIGHTLY_ROOT }}/logs/
            ${{ env.OMD_NIGHTLY_ROOT }}/profile-acceptance.json
          retention-days: 14
