name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Version to dry-run; must match the release lock and the newest changelog entry
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "version=${INPUT_VERSION:-${GITHUB_REF_NAME#v}}" >> "$GITHUB_OUTPUT"
      - name: Tag is on main
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Versions, changelog and links agree
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/release.py check "$VERSION"

  validate:
    needs: check
    uses: ./.github/workflows/validate.yml
    with:
      version: ${{ needs.check.outputs.version }}

  dry-run:
    needs: [check, validate]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: package
          path: release
      - name: Verify assets and show the publication commands
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          python3 scripts/release.py notes "$VERSION" > notes.md
          cat notes.md
          python3 scripts/nightly_ci.py publish --directory release --notes notes.md --dry-run

  publish:
    needs: [check, validate]
    if: github.event_name == 'push' && github.repository == 'dzkchen/oh-my-diff'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: package
          path: release
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          python3 scripts/release.py notes "$VERSION" > notes.md
          python3 scripts/nightly_ci.py publish --directory release --notes notes.md
