[package]
name = "codex-omd-extension"
version = "0.166.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
libc = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
futures-util = "=0.3.34"
http-body-util = "=0.1.3"
hyper = { version = "=1.11.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
chrono = { workspace = true }
codex-api = { workspace = true }
codex-async-utils = { workspace = true }
codex-client = { workspace = true }
codex-config = { workspace = true }
codex-core = { workspace = true }
codex-extension-api = { workspace = true }
codex-features = { workspace = true }
codex-file-watcher = { workspace = true }
codex-history = { workspace = true }
codex-model-provider = { workspace = true }
codex-model-provider-info = { workspace = true }
codex-models-manager = { workspace = true }
codex-network-proxy = { workspace = true }
codex-omd = { workspace = true }
codex-protocol = { workspace = true }
codex-tools = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-pty = { workspace = true }
codex-utils-path-uri = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "time", "sync"] }
sha2 = { workspace = true }
tempfile = { workspace = true }
codex-file-system = { workspace = true }
codex-sandboxing = { workspace = true }

[dev-dependencies]
codex-login = { workspace = true }
tiny_http = { workspace = true }
