[package]
name = "codex-omd-runner"
version = "1.2.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[[bin]]
name = "omd-runner"
path = "src/main.rs"

[dependencies]
aws-lc-rs = "=1.18.1"
base64 = "=0.22.1"
deno_core_icudata = { workspace = true }
getrandom = "=0.3.4"
libc = "=0.2.186"
serde_json = { version = "=1.0.149", features = ["preserve_order"] }
swc_common = "=26.0.0"
swc_ts_fast_strip = "=59.0.1"
uuid = { workspace = true }
v8 = { workspace = true, features = ["v8_enable_sandbox"] }
