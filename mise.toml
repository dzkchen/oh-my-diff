[tools]
git-cliff = "2.14.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.150"
"aqua:mozilla/sccache" = "0.19.0"
node = "24.22.1"

[tasks."check:changed"]
description = "Run portable checks and changed test files; --list previews, --base REF changes the comparison"
run = "python3 scripts/check_changed.py"

[tasks."dev:check"]
description = "Check selected Rust crates: dev:check NAME CRATE [CRATE...]"
usage = '''
arg "<name>" help="Scratch tree name"
arg "<packages>" var=#true help="Cargo package names"
'''
run = "python3 .github/scripts/build.py dev-check {{ usage.name | quote }}{% for package in usage.packages %} {{ package | quote }}{% endfor %}"

[tasks."dev:setup"]
description = "Prepare a scratch tree and its verified V8 prebuilt: dev:setup NAME"
usage = 'arg "<name>" help="Scratch tree name"'
run = "python3 .github/scripts/build.py dev-setup {{ usage.name | quote }}"

[tasks."dev:build"]
description = "Build the runnable debug app and mod engine: dev:build NAME"
usage = 'arg "<name>" help="Scratch tree name"'
run = "python3 .github/scripts/build.py dev-build {{ usage.name | quote }}"

[tasks."dev:run"]
description = "Build the tree and run it on this checkout's mods, reloading them as they change: dev:run NAME [--enable ID] [-- CODEX_ARGS]"
usage = '''
arg "<name>" help="Scratch tree name"
flag "--enable <id>" var=#true help="Also turn this first-party mod on"
arg "[codex]" var=#true help="Arguments for codex"
'''
run = "python3 .github/scripts/build.py dev-run {{ usage.name | quote }}{% for id in usage.enable | default(value=[]) %} --enable {{ id | quote }}{% endfor %} --{% for argument in usage.codex | default(value=[]) %} {{ argument | quote }}{% endfor %}"

[tasks."dev:refresh"]
description = "Replace an unedited tree's patch with this checkout's, in place: dev:refresh NAME"
usage = 'arg "<name>" help="Scratch tree name"'
run = "python3 .github/scripts/build.py dev-refresh {{ usage.name | quote }}"

[tasks."dev:mods"]
description = "Build only the debug mod engine and runner: dev:mods NAME"
usage = 'arg "<name>" help="Scratch tree name"'
run = "python3 .github/scripts/build.py dev-mods {{ usage.name | quote }}"

[tasks."dev:storage"]
description = "Show scratch-tree target sizes"
run = "python3 .github/scripts/build.py storage"

[tasks."dev:clean"]
description = "Delete selected targets: dev:clean NAME [NAME...]; stop their builds first"
usage = 'arg "<names>" var=#true help="Scratch tree names; deletes only their targets"'
run = "python3 .github/scripts/build.py clean{% for name in usage.names %} {{ name | quote }}{% endfor %}"

[tasks."mods:check"]
run = ["pnpm --dir mods check", "python3 scripts/mod_host_check.py --static", "python3 -m scripts.mods_lock --published"]

[tasks."native:ownership"]
run = "python3 scripts/check_native_ownership.py"

[tasks."mods:test"]
run = "pnpm --dir mods test"

[tasks."mods:host-check"]
run = "python3 scripts/mod_host_check.py"

[tasks."release"]
run = "python3 scripts/release.py prepare"

[tasks."release:status"]
run = "python3 scripts/release.py status"

[tasks."release:check"]
run = "python3 scripts/release.py check"
