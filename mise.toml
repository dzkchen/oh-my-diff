[tools]
git-cliff = "2.14.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.150"
node = "24.22.1"

[tasks."mods:check"]
run = ["pnpm --dir mods check", "python3 scripts/mod_host_check.py --static"]

[tasks."native:ownership"]
run = "python3 scripts/check_native_ownership.py"

[tasks."mods:test"]
run = "pnpm --dir mods test"

[tasks."mods:host-check"]
run = "python3 scripts/mod_host_check.py"

[tasks."release"]
run = "python3 scripts/release.py prepare"

[tasks."release:check"]
run = "python3 scripts/release.py check"
